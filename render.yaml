services:
  - type: web
    name: crm-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: SUPABASE_URL
        value: http://localhost
      - key: SUPABASE_ANON_KEY
        value: local-not-used
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: local-not-used
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: INIT_ADMIN_EMAIL
        value: admin@crm.local
      - key: INIT_ADMIN_PASSWORD
        sync: false
      - key: INIT_ADMIN_NAME
        value: 系统管理员

databases:
  - name: crm-db
    plan: free
    databaseName: crm
    user: crm
